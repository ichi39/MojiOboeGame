<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>もじさがしゲーム v3 🐣</title>
    <meta name="description" content="ひらがなを楽しく集める育成ゲーム。ことばを集めてペットを育てよう！">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Background particles & stars -->
    <div id="bg-particles"></div>

    <div id="app">
        <header>
            <h1 id="game-title">もじさがしゲーム</h1>
            <div id="header-stats" class="hidden">
                <div class="exp-bar-container">
                    <div class="exp-bar-label">Lv.<span id="pet-level">1</span></div>
                    <div class="exp-bar">
                        <div class="exp-bar-fill" id="exp-bar-fill" style="width: 0%"></div>
                    </div>
                    <div class="exp-text"><span id="words-collected">0</span>こ あつめた</div>
                </div>
            </div>
        </header>

        <main>
            <!-- にわ (Home) Scene -->
            <section id="niwa-scene" class="scene active">
                <div class="niwa-container">
                    <div id="niwa-bg-items" class="niwa-bg-items"></div>
                    <div id="niwa-pet" class="pet niwa-pet-bounce">🥚</div>
                    <div id="niwa-collection-items" class="niwa-collection-items"></div>
                    <div id="niwa-hearts" class="niwa-hearts"></div>
                </div>
                <div id="pet-speech-bubble" class="pet-speech-bubble hidden"></div>
                <div class="niwa-info">
                    <div class="niwa-pet-name" id="niwa-pet-name">🐣 ひよこ Lv.1</div>
                    <div class="niwa-words-count" id="niwa-words-count">ことば: 0こ あつめた</div>
                </div>
                <div id="pet-switch-bar" class="pet-switch-bar">
                    <button class="pet-switch-btn active" data-pet="chick">🐣 ひよこ</button>
                    <button class="pet-switch-btn locked" data-pet="mermaid">🔒 にんぎょ</button>
                </div>
                <div class="niwa-play-buttons">
                    <button class="btn btn-play" id="play-btn">🎮 あそぶ！</button>
                </div>
                <div class="niwa-nav-buttons">
                    <button class="btn btn-zukan" id="open-zukan-btn">📚 もじずかん</button>
                </div>
            </section>

            <!-- もじずかん Scene -->
            <section id="zukan-scene" class="scene">
                <h2>📚 もじずかん</h2>
                <div class="zukan-progress">
                    <span id="zukan-count">0</span>/46もじ マスター！
                    <div id="zukan-badges" class="zukan-badges"></div>
                </div>
                <div class="zukan-grid" id="zukan-grid">
                    <!-- 46 cells generated by JS -->
                </div>
                <div id="zukan-detail-modal" class="zukan-modal hidden">
                    <div class="zukan-modal-content">
                        <div id="zukan-detail-char" class="zukan-detail-char"></div>
                        <div id="zukan-detail-emoji" class="zukan-detail-emoji"></div>
                        <div id="zukan-detail-word" class="zukan-detail-word"></div>
                        <button id="zukan-detail-speak" class="btn btn-secondary">🔊 きいてみる</button>
                        <button id="zukan-detail-close" class="btn btn-secondary">とじる</button>
                    </div>
                </div>
                <button class="btn btn-secondary" id="close-zukan-btn">もどる</button>
            </section>

            <!-- Word Select Scene -->
            <section id="word-select-scene" class="scene">
                <h2 id="word-select-title">どれをあつめる？</h2>
                <div id="word-select-grid" class="word-select-grid">
                    <!-- Word cards generated by JS -->
                </div>
                <button class="btn btn-secondary" id="cancel-word-select-btn">もどる</button>
            </section>

            <!-- Mojisagashi Scene -->
            <section id="mojisagashi-scene" class="scene">
                <!-- 上部：シルエット＋文字枠 -->
                <div id="silhouette-area">
                    <div id="target-silhouette" class="target-silhouette"></div>
                    <div id="char-slots" class="char-slots"></div>
                </div>

                <!-- 下部：雲の選択肢 -->
                <div id="cloud-area" class="cloud-area">
                    <!-- 雲はJSで動的生成 -->
                </div>
            </section>

            <!-- Result Scene -->
            <section id="result-scene" class="scene">
                <h2 id="result-title">あつめたよ！</h2>
                <div class="result-pet-container">
                    <div id="result-pet" class="pet"></div>
                    <div id="evolution-message" class="hidden">しんかしたよ！✨</div>
                </div>
                <div class="result-details">
                    <div id="collected-word-display" class="collected-word-display hidden">
                        <div id="collected-word-emoji" class="collected-word-emoji"></div>
                        <div id="collected-word-text" class="collected-word-text"></div>
                    </div>
                    <div id="levelup-message" class="levelup-message hidden">
                        🎉 レベルアップ！
                    </div>
                    <div id="words-progress-display" class="words-progress-display"></div>
                </div>
                <button id="next-word-btn" class="btn btn-primary">つぎのことばへ ➡</button>
                <button id="retry-btn" class="btn btn-secondary">🏡 にわにもどる</button>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 MojiSagashiGame v3</p>
            <button id="reset-btn" class="btn-reset">さいしょからあそぶ</button>
        </footer>
    </div>

    <!-- Particle container -->
    <div id="particle-container"></div>

    <script src="script.js"></script>
</body>

</html>
