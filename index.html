<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>もじおぼえゲーム v2.1 🐣</title>
    <meta name="description" content="ひらがなを楽しく学べる育成ゲーム。ペットを育てて、もじずかんを完成させよう！">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Background particles & stars -->
    <div id="bg-particles"></div>

    <div id="app">
        <header>
            <h1 id="game-title">もじおぼえゲーム</h1>
            <div id="header-stats" class="hidden">
                <div class="exp-bar-container">
                    <div class="exp-bar-label">Lv.<span id="pet-level">1</span></div>
                    <div class="exp-bar">
                        <div class="exp-bar-fill" id="exp-bar-fill" style="width: 0%"></div>
                    </div>
                    <div class="exp-text"><span id="exp-current">0</span>/<span id="exp-next">100</span> EXP</div>
                </div>
            </div>
        </header>

        <main>
            <!-- Combo Display (floating overlay) -->
            <div id="combo-display" class="hidden">
                <span id="combo-count">0</span>コンボ！🔥
            </div>

            <!-- にわ (Home) Scene -->
            <section id="niwa-scene" class="scene active">
                <div class="niwa-container">
                    <div id="niwa-bg-items" class="niwa-bg-items"></div>
                    <div id="niwa-pet" class="pet niwa-pet-bounce">🥚</div>
                    <div id="niwa-hearts" class="niwa-hearts"></div>
                </div>
                <div class="niwa-info">
                    <div class="niwa-pet-name" id="niwa-pet-name">🐣 ひよこ Lv.1</div>

                </div>
                <div id="pet-switch-bar" class="pet-switch-bar">
                    <button class="pet-switch-btn active" data-pet="chick">🐣 ひよこ</button>
                    <button class="pet-switch-btn locked" data-pet="mermaid">🔒 にんぎょ</button>
                </div>
                <h2>なんいどをえらんでね</h2>
                <div class="difficulty-buttons">
                    <button class="btn btn-primary" data-difficulty="easy">🌱 やさしい (3もん)</button>
                    <button class="btn btn-primary btn-locked" data-difficulty="normal">🔒 ふつう (5もん)</button>
                    <button class="btn btn-primary btn-locked" data-difficulty="hard">🔒 むずかしい (10もん)</button>
                </div>
                <div class="niwa-nav-buttons">
                    <button class="btn btn-zukan" id="open-zukan-btn">📚 もじずかん</button>
                </div>
            </section>

            <!-- もじずかん Scene -->
            <section id="zukan-scene" class="scene">
                <h2>📚 もじずかん</h2>
                <div class="zukan-progress">
                    <span id="zukan-count">0</span>/46もじ マスター！
                    <div id="zukan-badges" class="zukan-badges"></div>
                </div>
                <div class="zukan-grid" id="zukan-grid">
                    <!-- 46 cells generated by JS -->
                </div>
                <div id="zukan-detail-modal" class="zukan-modal hidden">
                    <div class="zukan-modal-content">
                        <div id="zukan-detail-char" class="zukan-detail-char"></div>
                        <div id="zukan-detail-emoji" class="zukan-detail-emoji"></div>
                        <div id="zukan-detail-word" class="zukan-detail-word"></div>
                        <button id="zukan-detail-speak" class="btn btn-secondary">🔊 きいてみる</button>
                        <button id="zukan-detail-close" class="btn btn-secondary">とじる</button>
                    </div>
                </div>
                <button class="btn btn-secondary" id="close-zukan-btn">もどる</button>
            </section>

            <!-- Learning Scene -->
            <section id="learning-scene" class="scene">
                <h2>おぼえてね！</h2>
                <div class="learning-card">
                    <div class="hiragana-display">あ</div>
                    <div class="romaji-display">a</div>
                </div>
                <button id="next-learning-btn" class="btn btn-secondary">つぎへ</button>
            </section>

            <!-- Game Scene -->
            <section id="game-scene" class="scene">
                <div class="game-header">
                    <div class="score-board">スコア: <span id="score">0</span></div>
                    <div class="progress-info">のこり: <span id="questions-left">0</span></div>
                </div>

                <div class="pet-container">
                    <div id="game-pet" class="pet">🐤</div>
                </div>

                <div class="quiz-container">
                    <div class="question-display" id="question-text">?</div>
                    <div class="options-grid" id="options-container">
                        <!-- Options will be generated here -->
                    </div>
                </div>
            </section>

            <!-- Result Scene -->
            <section id="result-scene" class="scene">
                <h2 id="result-title">けっか</h2>
                <div class="result-pet-container">
                    <div id="result-pet" class="pet">🐤</div>
                    <div id="evolution-message" class="hidden">しんかしたよ！✨</div>
                </div>
                <div class="result-details">
                    <div class="final-score">スコア: <span id="final-score">0</span></div>
                    <div id="score-counter" class="score-counter"></div>
                    <div id="new-chars-display" class="new-chars hidden">
                        <h3>🆕 きょう おぼえた もじ</h3>
                        <div id="new-chars-list" class="new-chars-list"></div>
                    </div>
                    <div id="exp-earned-display" class="exp-earned hidden">
                        +<span id="exp-earned-amount">0</span> EXP！
                    </div>
                    <div id="levelup-message" class="levelup-message hidden">
                        🎉 レベルアップ！
                    </div>
                </div>
                <button id="retry-btn" class="btn btn-primary">🏡 にわにもどる</button>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 MojiOboeGame v2.1</p>
            <button id="reset-btn" class="btn-reset">さいしょからあそぶ</button>
        </footer>
    </div>

    <!-- Particle container -->
    <div id="particle-container"></div>

    <script src="script.js"></script>
</body>

</html>
